name: build

# Every push: run the tests and build both apps (downloadable from the run).
# To publish a release, either push a tag like v1.0.0, or run this workflow
# from the Actions tab with a version: the release step creates the tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.2.0 (leave empty to only build)"
        required: false

permissions:
  contents: write

env:
  # The brignano/design release assets/tokens.css is copied from. Bump it
  # and replace the file together (README: "Design system").
  DESIGN_TOKENS: v0.5.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q
      - name: Tokens match the pinned design system release
        run: >
          curl -fsSL "https://cdn.jsdelivr.net/gh/brignano/design@${DESIGN_TOKENS}/tokens.css"
          | diff -u - assets/tokens.css

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: Breakeven-windows.zip
          - os: macos-latest
            asset: Breakeven-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      # --icon is the .exe / .app icon; --add-data ships the PNG the window
      # uses and the design tokens it takes its colours from.
      - run: >
          pyinstaller --windowed --onefile --name "Breakeven"
          --icon ${{ runner.os == 'Windows' && 'assets/icon.ico' || 'assets/icon.icns' }}
          --add-data "assets/icon.png:assets"
          --add-data "assets/tokens.css:assets"
          breakeven.py

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Breakeven.exe" -DestinationPath "${{ matrix.asset }}"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the .app bundle's permissions and symlinks; plain zip breaks it.
        run: ditto -c -k --keepParent "dist/Breakeven.app" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # One job publishes, so the two builds don't race to create the same release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: Breakeven-*.zip
          # List the pull requests merged since the last release as the notes.
          generate_release_notes: true
